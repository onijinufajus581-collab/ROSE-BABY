
name: ROSE AI APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ROSE AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Extract Android ZIP
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/rose-project"

          echo "Searching ZIP files..."

          while IFS= read -r -d '' file; do
            if unzip -tqq "$file" >/dev/null 2>&1; then
              echo "Extracting: $file"
              unzip -oq "$file" -d "$RUNNER_TEMP/rose-project"
            fi
          done < <(
            find . -type f -not -path './.git/*' -print0
          )

          echo "Extraction completed."

      # 5. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching Android project..."

          APP_GRADLE=$(
            find "$RUNNER_TEMP/rose-project" . \
              -type f \
              \( -path '*/app/build.gradle' \
              -o -path '*/app/build.gradle.kts' \) \
              -not -path '*/.git/*' \
              -print -quit
          )

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found!"
            echo "Project files:"
            find "$RUNNER_TEMP/rose-project" -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      # 6. Automatically fix Kotlin color visibility
      - name: Fix Kotlin Color Visibility
        shell: bash
        run: |
          set -e

          echo "Fixing Kotlin color variables..."

          find "$PROJECT_DIR/app/src/main/java" \
            -type f -name "*.kt" \
            -exec sed -i -E \
            's/private[[:space:]]+val[[:space:]]+(Deep|Cyan|Panel|Pink)[[:space:]]*=/val \1 =/' {} +

          echo "Color visibility fix completed."

      # 7. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # 8. Upload APK
      - name: Upload ROSE AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
