
name: ROSE AI APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching Android project..."
          SETTINGS=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder missing in $PROJECT_DIR"
            echo "Repository folders:"
            find . -maxdepth 4 -type d | sort
            exit 1
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
          
